name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            requirements: requirements-win.txt
            python_venv: .venv\Scripts\python.exe
          - os: macos-latest
            platform: mac
            requirements: requirements-mac.txt
            python_venv: .venv/bin/python
          - os: ubuntu-latest
            platform: linux
            requirements: requirements-linux.txt
            python_venv: .venv/bin/python

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ---- Python backend (install into venv) ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create backend venv and install deps
        working-directory: backend
        run: |
          python -m venv .venv
          ${{ matrix.python_venv }} -m pip install --upgrade pip
          ${{ matrix.python_venv }} -m pip install -r ${{ matrix.requirements }}

      - name: Verify backend starts
        working-directory: backend
        run: |
          ${{ matrix.python_venv }} -c "from src.main import main; print('Backend imports OK')"

      # ---- Node.js frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build Electron app
        working-directory: frontend
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voicescribe-${{ matrix.platform }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.zip
            release/**/win-unpacked/**
            release/**/mac-unpacked/**
            release/**/linux-unpacked/**
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.zip
