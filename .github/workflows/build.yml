name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            requirements: requirements-win.txt
          # macOS and Linux disabled until Windows build is stable
          # - os: macos-latest
          #   platform: mac
          #   requirements: requirements-mac.txt
          # - os: ubuntu-latest
          #   platform: linux
          #   requirements: requirements-linux.txt

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- Build portable Python backend ----
      - name: Create portable backend (Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        shell: pwsh
        run: |
          # Download Python embeddable package (fully portable, no registry)
          $pyVersion = "3.11.9"
          $zipUrl = "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile python-embed.zip
          New-Item -ItemType Directory -Force -Path .venv-portable/Scripts
          Expand-Archive python-embed.zip -DestinationPath .venv-portable/Scripts -Force
          Remove-Item python-embed.zip

          # Enable site-packages in ._pth file (needed for pip install)
          $pthFile = Get-ChildItem .venv-portable/Scripts/python*._pth | Select-Object -First 1
          @("python311.zip", ".", "Lib\site-packages", "import site") | Set-Content $pthFile

          # Install pip into embedded Python
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          .venv-portable/Scripts/python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py

          # Install project dependencies
          .venv-portable/Scripts/python.exe -m pip install -r requirements-win.txt --no-warn-script-location

          # Remove ._pth file so PYTHONPATH works at runtime
          # (._pth overrides sys.path completely, blocking PYTHONPATH)
          Remove-Item $pthFile

          # Verify backend can import
          $sitePkgs = Join-Path (Get-Location).Path ".venv-portable\Scripts\Lib\site-packages"
          $env:PYTHONPATH = "$(Get-Location);$sitePkgs"
          .venv-portable/Scripts/python.exe -c "from src.main import main; print('Backend imports OK')"

      - name: Create portable backend (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: backend
        run: |
          # Create venv with copies (embeds python binary, not symlinks)
          python -m venv --copies .venv-portable
          .venv-portable/bin/python -m pip install --upgrade pip
          .venv-portable/bin/python -m pip install -r ${{ matrix.requirements }}

          # Make shebangs portable
          find .venv-portable/bin -maxdepth 1 -type f | while read f; do
            if head -1 "$f" | grep -q "^#!.*python"; then
              sed -i.bak "1s|#!.*|#!/usr/bin/env python3|" "$f" && rm -f "$f.bak"
            fi
          done

          # Verify
          .venv-portable/bin/python -c "from src.main import main; print('Backend imports OK')"

      # ---- Node.js frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build Electron app
        working-directory: frontend
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # Zip the unpacked build for release download
      - name: Package build for release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content frontend/package.json | ConvertFrom-Json).version
          $src = "release/$version/win-unpacked"
          $dst = "release/VoiceScribe-v$version-win-x64.zip"
          if (Test-Path $src) {
            Compress-Archive -Path $src -DestinationPath $dst -Force
            Write-Host "Created $dst"
          }

      - name: Package build for release (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          if [ -d "release/$VERSION" ]; then
            cd "release/$VERSION"
            for f in *.dmg *.AppImage; do
              [ -f "$f" ] && echo "Found $f"
            done
            # Zip unpacked dirs if any
            for d in */; do
              if [ -d "$d" ]; then
                zip -r "../VoiceScribe-v$VERSION-${d%/}.zip" "$d"
              fi
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voicescribe-${{ matrix.platform }}
          path: |
            release/*.zip
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.zip
